name: Aggiorna e pubblica

on:
  schedule:
    - cron: "17 5 * * 1"   # ogni lunedì alle 05:17 UTC (07:17 in Italia d'estate)
  workflow_dispatch:         # pulsante "Run workflow" nella scheda Actions
    inputs:
      crea_edizione:
        description: "Crea l'edizione di questa settimana"
        type: boolean
        default: false
  # un push prova il codice e pubblica il sito con i dati già salvati: i dati li raccolgono solo i due eventi qui sopra.
  # Dopo una modifica a pipeline/ o config/, quindi, per vederne l'effetto sui dati serve un avvio manuale.
  # data/edizioni è qui per le correzioni a mano: l'unica eccezione alla regola per cui data/ la scrive solo questo workflow.
  # Una correzione si pubblica così da sola, e i commit del workflow non fanno partire altri giri
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pipeline/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "data/edizioni/**"

permissions:
  contents: write   # per salvare i dati aggiornati nel repository
  pages: write      # per pubblicare su GitHub Pages
  id-token: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false
  # senza, un giro in attesa viene cancellato dal successivo: un push potrebbe far perdere la raccolta del lunedì
  queue: max

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      edizione: ${{ steps.edizione.outcome }}
    steps:
      # l'ultimo commit del ramo, non quello che ha fatto partire il giro: un giro rimasto in coda parte così
      # dai dati salvati dal giro prima, e pubblica anche i push arrivati nel frattempo
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # l'indirizzo pubblico del sito, per tutti i passi del job: la build che verrà pubblicata è quella rilanciata dagli end-to-end
      - name: Ricava l'indirizzo base dal nome del repository
        run: echo "AI_RADAR_BASE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          npm ci --prefix web

      - name: Test della pipeline
        run: python -m pytest -q

      - name: Test dell'app
        working-directory: web
        run: |
          npm run check
          npm test

      - name: Raccogli i dati
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          AI_RADAR_USER_AGENT: "ai-radar (+https://github.com/${{ github.repository }})"
        run: python -m pipeline.run

      - name: Salva i dati nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da salvare."
          else
            git commit -m "Dati aggiornati $(date -u +%F)"
            # un push arrivato mentre il giro girava: i dati vanno sopra. Il rebase passa se il push non tocca i file
            # scritti dal giro, e data/ la scrivono solo i giri programmati e manuali di questo workflow, uno alla volta:
            # mai quelli del push. L'unica eccezione sono le correzioni a mano, su edizioni già uscite, che il giro non
            # riscrive mai. Se il push tocca i percorsi in `on.push`, ha già messo in coda il suo giro, che pubblicherà
            # anche lui, con i dati appena salvati
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Il file dell'edizione nasce qui, senza commit: diventa definitivo solo dopo gli end-to-end. Evento e casella li valuta il comando,
      # che su un push o con il file già presente non fa nulla. Se fallisce, dati e sito proseguono e il job in fondo manda il giro in rosso;
      # si rimedia con la casella del giro manuale
      - name: Crea l'edizione
        id: edizione
        continue-on-error: true
        working-directory: web
        env:
          EVENTO: ${{ github.event_name }}
          CASELLA: ${{ inputs.crea_edizione }}
        run: npm run edizione -- --evento "$EVENTO" --casella "$CASELLA"

      - name: Prepara il sito
        run: python scripts/build_site.py

      - name: Test end-to-end
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      # dopo gli end-to-end: se falliscono il job si ferma qui, l'edizione non si salva e il sito non esce.
      # L'autore del commit l'ha già impostato il passo che salva i dati, e senza quel passo (un push) non c'è niente da salvare
      - name: Salva l'edizione nel repository
        if: steps.edizione.outcome == 'success'
        run: |
          if [ -d data/edizioni ]; then git add data/edizioni; fi
          if git diff --cached --quiet; then
            echo "Nessuna edizione nuova da salvare."
          else
            git commit -m "Edizione del $(date -u +%F)"
            # come per i dati: un push arrivato nel frattempo resta sotto
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # L'errore nella sola creazione dell'edizione non ferma dati e sito, ma deve arrivare la mail di GitHub
  edizione-non-creata:
    needs: aggiorna
    if: ${{ !cancelled() && needs.aggiorna.outputs.edizione == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Manda il giro in rosso
        run: |
          echo "::error::L'edizione di questa settimana non è stata creata. Dati e sito sono andati avanti: per recuperarla, avvia il giro a mano con la casella accesa."
          exit 1
