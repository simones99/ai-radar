name: Aggiorna e pubblica

on:
  schedule:
    - cron: "17 5 * * 1"   # ogni lunedì alle 05:17 UTC (07:17 in Italia d'estate)
  workflow_dispatch:         # pulsante "Run workflow" nella scheda Actions
    inputs:
      crea_edizione:
        description: "Crea l'edizione di questa settimana (ha effetto solo quando le edizioni esistono)"
        type: boolean
        default: false
  # un push prova il codice e pubblica il sito con i dati già salvati: i dati li raccolgono solo i due eventi qui sopra.
  # Dopo una modifica a pipeline/ o config/, quindi, per vederne l'effetto sui dati serve un avvio manuale
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pipeline/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: write   # per salvare i dati aggiornati nel repository
  pages: write      # per pubblicare su GitHub Pages
  id-token: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # l'ultimo commit del ramo, non quello che ha fatto partire il giro: un giro rimasto in coda parte così
      # dai dati salvati dal giro prima, e pubblica anche i push arrivati nel frattempo
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          npm ci --prefix web

      - name: Test della pipeline
        run: python -m pytest -q

      - name: Test dell'app
        working-directory: web
        run: |
          npm run check
          npm test

      - name: Raccogli i dati
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          AI_RADAR_USER_AGENT: "ai-radar (+https://github.com/${{ github.repository }})"
        run: python -m pipeline.run

      - name: Salva i dati nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da salvare."
          else
            git commit -m "Dati aggiornati $(date -u +%F)"
            # un push arrivato mentre il giro girava: i dati vanno sopra. Il rebase passa se il push non tocca data/,
            # e data/ la scrivono solo i giri programmati e manuali di questo workflow, uno alla volta: mai quelli
            # del push. Se tocca i percorsi in `on.push`, il push ha già messo in coda il suo giro, che pubblicherà
            # anche lui, con i dati appena salvati
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Prepara il sito
        run: python scripts/build_site.py

      - name: Test end-to-end
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
