name: Controlli

# Gli stessi test di «Aggiorna e pubblica», senza raccogliere dati né pubblicare,
# sui rami diversi da main e sulle pull request. Gli end-to-end e i test con il browser restano lì.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installa le dipendenze
        run: |
          pip install -r requirements.txt
          npm ci --prefix web

      - name: Test della pipeline
        run: python -m pytest -q

      - name: Test dell'app
        working-directory: web
        run: |
          npm run check
          npm test

  # la guida ha dipendenze sue, come nel job «guida» di «Aggiorna e pubblica»
  guida:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-guida.txt

      - name: Installa Zensical
        run: pip install -r requirements-guida.txt

      # si ferma su un link rotto tra le pagine della guida
      - name: Costruisci la guida
        run: zensical build --strict
