# Gli esempi del Filo della catena nella mappa di GeopoliticAI: tre percorsi scelti da noi, non un dato.
#
# Ogni esempio ha sei tappe, una per anello, nell'ordine delle fermate: materie, progettazione, fabbricazione,
# macchinari, datacenter, modelli. Ogni tappa ha il luogo, il Paese (codice ADM0_A3), le coordinate, una frase e la
# fonte che la sostiene. Fonti lette il 26 ottobre 2026. Il data center di ogni esempio è un sito di Epoch,
# con il suo nome e le sue coordinate (data/geopoliticai_siti.json).
#
# Da sapere, prima di cambiare una tappa:
# - Gallio: nessuna fonte affidabile lega il gallio a una raffineria precisa. La tappa è la Cina, su un punto indicativo
#   (il centro geografico), con la quota dello USGS.
# - TSMC a Tainan: è una deduzione. Il 4NP delle Blackwell è della famiglia dei 5 nm, che TSMC fa nella Fab 18 di Tainan.
#   Dall'ottobre 2025 TSMC fa wafer Blackwell anche in Arizona.
# - La pagina di OpenAI sull'addestramento ad Abilene non si legge dai client automatici (403): per controllarla
#   va aperta in un browser. Le tappe 5 e 6 americane si appoggiano a lei; Epoch dà ad Abilene GPU B200 e B300,
#   OpenAI sistemi GB200, e teniamo OpenAI.
# - Chi fabbrica gli Ascend non è chiaro: TechInsights ha trovato anche die di TSMC. La frase su SMIC è attribuita
#   al Congresso USA, che scrive «purportedly».
# - Pangu Ultra non dice dove è stato addestrato: il legame con Huawei Wuhu è una nostra scelta, coerente con gli Ascend.

fili:
  usa:
    nome: Un modello americano
    tappe:
      - anello: materie
        luogo: Gallio
        iso: CHN
        lat: 35.86
        lon: 104.20
        frase: "La Cina produce il 99% del gallio primario mondiale, ricavato soprattutto dalla lavorazione della bauxite."
        fonte: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-gallium.pdf
      - anello: progettazione
        luogo: NVIDIA, Santa Clara
        iso: USA
        lat: 37.37
        lon: -121.96
        frase: "Progetta le GPU Blackwell, con 208 miliardi di transistor; a fabbricarle è TSMC, con un processo 4NP su misura."
        fonte: https://www.nvidia.com/en-us/data-center/technologies/blackwell-architecture/
      - anello: fabbricazione
        luogo: TSMC, Tainan
        iso: TWN
        lat: 23.11
        lon: 120.28
        frase: "A Tainan c'è la Fab 18, la GigaFab di TSMC nata per i chip a 5 nanometri."
        fonte: https://pr.tsmc.com/english/news/1951
      - anello: macchinari
        luogo: ASML, Veldhoven
        iso: NLD
        lat: 51.41
        lon: 5.46
        frase: "È l'unica al mondo a costruire macchine EUV, usate per gli strati più fini dei chip più avanzati."
        fonte: https://www.sec.gov/Archives/edgar/data/937966/000093796625000011/a2024annualreportbasedon.htm
      - anello: datacenter
        luogo: OpenAI Stargate Abilene, Texas
        iso: USA
        lat: 32.50
        lon: -99.79
        frase: "Il sito Stargate di punta di OpenAI, operativo: gira su Oracle Cloud Infrastructure, con sistemi NVIDIA GB200."
        fonte: https://openai.com/index/building-the-compute-infrastructure-for-the-intelligence-age/
      - anello: modelli
        luogo: OpenAI, San Francisco
        iso: USA
        lat: 37.77
        lon: -122.39
        frase: "Sviluppa i modelli GPT: GPT-5.5 è stato addestrato nel sito di Abilene."
        fonte: https://openai.com/index/building-the-compute-infrastructure-for-the-intelligence-age/

  ue:
    nome: Un modello europeo
    tappe:
      - anello: materie
        luogo: Gallio
        iso: CHN
        lat: 35.86
        lon: 104.20
        frase: "Anche per l'Europa il gallio viene dalla Cina, che ne produce il 99% del primario mondiale."
        fonte: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026-gallium.pdf
      - anello: progettazione
        luogo: NVIDIA, Santa Clara
        iso: USA
        lat: 37.37
        lon: -121.96
        frase: "Progetta le GPU Vera Rubin che ospiterà il data center svedese usato da Mistral AI."
        fonte: https://ecodatacenter.tech/press/mistral-ai-and-ecodatacenter-partner-to-build-ai-focused-data-center-in-sweden-3431886
      - anello: fabbricazione
        luogo: TSMC, Tainan
        iso: TWN
        lat: 23.11
        lon: 120.28
        frase: "Le GPU NVIDIA le fabbrica TSMC: le Blackwell, per esempio, con un processo 4NP su misura."
        fonte: https://www.nvidia.com/en-us/data-center/technologies/blackwell-architecture/
      - anello: macchinari
        luogo: ASML, Veldhoven
        iso: NLD
        lat: 51.41
        lon: 5.46
        frase: "L'olandese ASML è oggi l'unica al mondo a costruire macchine per la litografia EUV."
        fonte: https://www.sec.gov/Archives/edgar/data/937966/000093796625000011/a2024annualreportbasedon.htm
      - anello: datacenter
        luogo: EcoDataCenter 2, Borlänge
        iso: SWE
        lat: 60.53
        lon: 15.42
        frase: "In costruzione nell'ex cartiera di Kvarnsveden; secondo Epoch i chip saranno di Mistral AI, che li userà."
        fonte: https://epoch.ai/data/ai-data-centers/directory/ecodatacenter-2
      - anello: modelli
        luogo: Mistral AI, Parigi
        iso: FRA
        lat: 48.86
        lon: 2.35
        frase: "La prima infrastruttura di Mistral AI fuori dalla Francia servirà a sviluppare e far girare i suoi prossimi modelli."
        fonte: https://ecodatacenter.tech/press/mistral-ai-and-ecodatacenter-partner-to-build-ai-focused-data-center-in-sweden-3431886

  cina:
    nome: Un modello cinese
    tappe:
      - anello: materie
        luogo: Gallio
        iso: CHN
        lat: 35.86
        lon: 104.20
        frase: "La materia prima è in casa, la Cina produce il 99% del gallio primario mondiale."
