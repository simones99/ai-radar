        lat: 51.41
        lon: 5.46
        frase: "I Paesi Bassi negano alla Cina le macchine EUV; dal 2023 serve una licenza anche per le DUV più avanzate."
        fonte: https://selectcommitteeontheccp.house.gov/sites/evo-subsites/selectcommitteeontheccp.house.gov/files/evo-media-document/selling-the-forges-of-the-future.pdf
      - anello: datacenter
        luogo: Huawei Wuhu, Anhui
        iso: CHN
        lat: 31.29
        lon: 118.30
        frase: "Data center di Huawei, operativo; secondo Epoch ha chip Ascend 910C."
        fonte: https://epoch.ai/data/ai-data-centers/directory/huawei-wuhu
      - anello: modelli
        luogo: Huawei Pangu, Shenzhen
        iso: CHN
        lat: 22.65
        lon: 114.06
        frase: "Pangu Ultra, 135 miliardi di parametri, è stato addestrato su 8.192 chip Ascend."
        fonte: https://arxiv.org/abs/2504.07866
