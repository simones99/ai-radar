# L'anello delle materie prime della mappa di GeopoliticAI: un insieme di quote per materiale.
#
# Gallio, terre rare e silicio metallico vengono dallo USGS, Mineral Commodity Summaries 2026 (6 febbraio 2026),
# in pubblico dominio. Il CSV del data release su ScienceBase non si scarica dai client automatici: i numeri
# vengono dalle tabelle «World production» del PDF, scaricato il 26 ottobre 2026. Il germanio viene dallo studio
# della Commissione europea sulle materie prime critiche del 2023 (CC BY 4.0), perché lo USGS non dà numeri per Paese.
# Si aggiorna a mano a febbraio, quando esce la nuova edizione di MCS.
#
# Quote in % del totale mondiale, per codice ADM0_A3, arrotondate a una cifra decimale. I Paesi sotto lo 0,1%
# restano fuori. L'Italia non produce nessuno dei quattro materiali.

anelli:
  materie:
    materiali:
      gallio:
        # MCS 2026, p. 83, «World Low-Purity Production», 2025 stimato, in kg: Cina 900.000, Russia 6.000,
        # Giappone 3.000. Il totale mondiale (900.000) è arrotondato: la quota è sulla somma dei Paesi, 909.000.
        nome: Gallio
        misura: Quota della produzione primaria mondiale, stima del 2025
        fonte: USGS
        titolo: Mineral Commodity Summaries 2026
        url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026.pdf
        licenza: pubblico dominio
        url_licenza: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
        data: "2025"
        quote: {CHN: 99.0, RUS: 0.7, JPN: 0.3}

      terre:
        # MCS 2026, p. 153, «World Mine Production», 2025 stimato, in tonnellate di ossidi, sul totale mondiale di 390.000:
        # Cina 270.000, USA 51.000, Australia 29.000, Birmania 22.000, Thailandia 4.800, India 2.900,
        # Madagascar 2.700, Russia 2.600, Brasile 2.000, Nigeria 1.500. Fuori Vietnam (150) e Malesia (110).
        nome: Terre rare
        misura: Quota della produzione mineraria mondiale, stima del 2025
        fonte: USGS
        titolo: Mineral Commodity Summaries 2026
        url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026.pdf
        licenza: pubblico dominio
        url_licenza: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
        data: "2025"
        quote: {CHN: 69.2, USA: 13.1, AUS: 7.4, MMR: 5.6, THA: 1.2, IND: 0.7, MDG: 0.7, RUS: 0.7, BRA: 0.5, NGA: 0.4}

      silicio:
        # MCS 2026, p. 171, «World Production», silicio metallico, 2025 stimato, in migliaia di tonnellate, sul totale
        # mondiale senza gli USA (4.600): Cina 4.000, Brasile 180, Norvegia 130, Francia 68, Australia 47, Russia 35,
        # Canada 34, Islanda 16, Germania 13, Sudafrica 10, Kazakistan 7, Spagna 4.
        nome: Silicio metallico
        misura: Quota della produzione mondiale, stima del 2025
        fonte: USGS
        titolo: Mineral Commodity Summaries 2026
        url: https://pubs.usgs.gov/periodicals/mcs2026/mcs2026.pdf
        licenza: pubblico dominio
        url_licenza: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
        data: "2025"
        quote: {CHN: 87.0, BRA: 3.9, NOR: 2.8, FRA: 1.5, AUS: 1.0, RUS: 0.8, CAN: 0.7, ISL: 0.3, DEU: 0.3, ZAF: 0.2, KAZ: 0.2, ESP: 0.1}
        nota: Gli USA non sono nel conto del silicio metallico, perché lo USGS non pubblica il dato per riservatezza.

      germanio:
        # Study on the critical raw materials for the EU 2023 (DOI 10.2873/725585), quota della raffinazione mondiale,
        # media 2016-2020, «DG GROW elaboration on multiple sources». Numeri dalla ricerca research/fonti-mappa.
        nome: Germanio
        misura: Quota della raffinazione mondiale, media 2016-2020
        fonte: Commissione europea
        titolo: Study on the critical raw materials for the EU 2023
        url: https://op.europa.eu/en/publication-detail/-/publication/57318397-fdd4-11ed-a05c-01aa75ed71a1
        licenza: CC BY 4.0
        url_licenza: https://creativecommons.org/licenses/by/4.0/
        data: "2016-2020"
        quote: {CHN: 83.1, RUS: 5.0, BEL: 4.5, DEU: 2.7, USA: 2.0, JPN: 1.8, UKR: 0.9}
