# Competenze monitorate dal radar "Su cosa formarsi".
#
# nome è il nome completo (tabella, tooltip); breve è l'etichetta sul grafico
# (facoltativa, se manca si usa nome). plurale: true se breve è al plurale,
# così le frasi accordano il verbo («DB vettoriali perdono», non «perde»).
#
# Ogni competenza ha tre segnali, tutti opzionali:
#   arxiv:  frasi cercate negli abstract dei paper (OR tra le frasi)
#   github: un topic GitHub; si contano i nuovi repository creati ogni mese
#   jobs:   ricerca Adzuna. Per confrontare le competenze tra loro si usa per tutte
#           lo stesso tipo di ricerca, una frase esatta (what_phrase), in inglese.
#           Niente "AI" nella frase: nell'indice italiano "ai" è una preposizione
#           e viene ignorata, quindi "AI governance" diventa "governance".
#           Se cambi una frase, la crescita della domanda riparte da zero per quella competenza.
#   risorse: 2-4 link «Per iniziare», gratuiti, controllati a mano.
#            tipo: documentazione, corso, guida o repository; lingua: it se in italiano (altrimenti en).
#            La pipeline controlla i link ogni settimana e nasconde quelli che non rispondono per due giri di fila.
#
# Per aggiungere o togliere una competenza basta modificare questo file:
# al prossimo aggiornamento la pipeline recupera lo storico che manca.

skills:
  - id: agenti
    nome: Agenti AI
    breve: Agenti AI
    plurale: true
    descrizione: Sistemi che pianificano e usano strumenti per completare compiti in più passi.
    arxiv: ["LLM agent", "LLM agents", "agentic"]
    github: ai-agents
    jobs: {what_phrase: "agentic AI"}
    risorse:
      - {titolo: "Corso gratuito di Hugging Face sugli agenti", url: "https://huggingface.co/learn/agents-course/en/unit0/introduction", tipo: corso}
      - {titolo: "Guida Anthropic: costruire agenti efficaci", url: "https://www.anthropic.com/engineering/building-effective-agents", tipo: guida}
      - {titolo: "Documentazione OpenAI sugli agenti", url: "https://developers.openai.com/api/docs/guides/agents", tipo: documentazione}

  - id: coding-agenti
    nome: Sviluppo con agenti di coding
    breve: Agenti di coding
    plurale: true
    descrizione: Scrivere e mantenere software delegando a agenti come Claude Code o Codex.
    arxiv: ["coding agent", "software engineering agent", "SWE-bench"]
    github: coding-agent
    jobs: {what_phrase: "coding agent"}
    risorse:
      - {titolo: "Documentazione ufficiale di Claude Code", url: "https://code.claude.com/docs/en/overview", tipo: documentazione}
      - {titolo: "Buone pratiche per lavorare con Claude Code", url: "https://code.claude.com/docs/en/best-practices", tipo: guida}
      - {titolo: "Repository di Codex CLI (OpenAI)", url: "https://github.com/openai/codex", tipo: repository}

  - id: mcp
    nome: Model Context Protocol (MCP)
    breve: MCP
    descrizione: Lo standard per collegare modelli e agenti a strumenti e dati esterni.
    arxiv: ["Model Context Protocol"]
    github: mcp
    jobs: {what_phrase: "Model Context Protocol"}
    risorse:
      - {titolo: "Documentazione ufficiale di MCP: introduzione", url: "https://modelcontextprotocol.io/docs/getting-started/intro", tipo: documentazione}
      - {titolo: "Corso gratuito di Hugging Face su MCP", url: "https://huggingface.co/learn/mcp-course/unit0/introduction", tipo: corso}
      - {titolo: "Repository dei server MCP di riferimento", url: "https://github.com/modelcontextprotocol/servers", tipo: repository}

  - id: rag
    nome: RAG e ricerca semantica
    breve: RAG
    descrizione: Far rispondere i modelli sui propri documenti tramite recupero di informazioni.
    arxiv: ["retrieval-augmented generation", "retrieval augmented generation"]
    github: rag
    jobs: {what_phrase: "retrieval augmented generation"}
    risorse:
      - {titolo: "Introduzione al RAG nella documentazione LlamaIndex", url: "https://developers.llamaindex.ai/python/framework/understanding/rag/", tipo: guida}
      - {titolo: "Corso gratuito DeepLearning.AI sul RAG avanzato", url: "https://www.deeplearning.ai/courses/building-evaluating-advanced-rag", tipo: corso}
      - {titolo: "Ricetta Hugging Face: RAG avanzato", url: "https://huggingface.co/learn/cookbook/advanced_rag", tipo: guida}
      - {titolo: "Guida OpenAI al retrieval", url: "https://developers.openai.com/api/docs/guides/retrieval", tipo: documentazione}

  - id: valutazione
    nome: Valutazione dei modelli (eval)
    breve: Eval
    descrizione: Misurare se un sistema AI fa davvero il lavoro, con test ripetibili.
    arxiv: ["LLM evaluation", "evaluating large language models", "LLM-as-a-judge"]
    github: llm-evaluation
    jobs: {what_phrase: "LLM evaluation"}
    risorse:
      - {titolo: "Anthropic: definire criteri di successo e valutazioni", url: "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", tipo: guida}
      - {titolo: "Guida OpenAI alle valutazioni (evals)", url: "https://developers.openai.com/api/docs/guides/evals", tipo: documentazione}
      - {titolo: "Repository lm-evaluation-harness di EleutherAI", url: "https://github.com/EleutherAI/lm-evaluation-harness", tipo: repository}
      - {titolo: "Documentazione di Hugging Face Evaluate", url: "https://huggingface.co/docs/evaluate/index", tipo: documentazione}

  - id: post-training
    nome: Fine-tuning e post-training
    breve: Fine-tuning
    descrizione: Adattare un modello aperto a un dominio specifico con dati propri.
    arxiv: ["fine-tuning large language models", "post-training", "parameter-efficient fine-tuning"]
    github: fine-tuning
    jobs: {what_phrase: "LLM fine-tuning"}
    risorse:
      - {titolo: "Corso Hugging Face: supervised fine-tuning", url: "https://huggingface.co/learn/llm-course/chapter11/1", tipo: corso}
      - {titolo: "Documentazione di PEFT (LoRA e simili)", url: "https://huggingface.co/docs/peft/index", tipo: documentazione}
      - {titolo: "Documentazione di TRL per il post-training", url: "https://huggingface.co/docs/trl/index", tipo: documentazione}

  - id: context-engineering
    nome: Prompt e context engineering
    breve: Context engineering
    descrizione: Progettare istruzioni, contesto e memoria che rendono affidabile un modello.
    arxiv: ["prompt engineering", "context engineering"]
    github: prompt-engineering
    jobs: {what_phrase: "prompt engineering"}
    risorse:
      - {titolo: "Guida al prompt engineering (Prompt Engineering Guide)", url: "https://www.promptingguide.ai/it", tipo: guida, lingua: it}
      - {titolo: "Anthropic: panoramica sul prompt engineering", url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", tipo: documentazione}
      - {titolo: "Anthropic: context engineering per agenti", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", tipo: guida}
      - {titolo: "Guida OpenAI al prompt engineering", url: "https://developers.openai.com/api/docs/guides/prompt-engineering", tipo: documentazione}

  - id: sicurezza
    nome: Sicurezza dei sistemi AI
    breve: Sicurezza AI
    descrizione: Prompt injection, permessi degli agenti, red teaming, difesa con l'AI.
    arxiv: ["prompt injection", "jailbreak", "AI security"]
    github: ai-security
    jobs: {what_phrase: "LLM security"}
    risorse:
      - {titolo: "OWASP Top 10 per applicazioni LLM", url: "https://genai.owasp.org/llm-top-10/", tipo: guida}
      - {titolo: "MITRE ATLAS: tattiche e tecniche contro l'AI", url: "https://atlas.mitre.org/", tipo: documentazione}
      - {titolo: "NIST AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework", tipo: documentazione}

  - id: governance
    nome: Governance e conformità AI
    breve: Governance
    descrizione: AI Act, gestione del rischio, audit e documentazione dei sistemi AI.
    arxiv: ["AI governance", "AI Act", "AI regulation"]
    github: ai-governance
    jobs: {what_phrase: "model governance"}
    risorse:
      - {titolo: "Commissione europea: quadro normativo sull'AI", url: "https://digital-strategy.ec.europa.eu/it/policies/regulatory-framework-ai", tipo: guida, lingua: it}
      - {titolo: "Commissione europea: governance dell'AI Act", url: "https://digital-strategy.ec.europa.eu/it/policies/ai-act-governance-and-enforcement", tipo: guida, lingua: it}
      - {titolo: "NIST AI Risk Management Framework", url: "https://www.nist.gov/itl/ai-risk-management-framework", tipo: documentazione}

  - id: dati-per-ai
    nome: Data engineering per l'AI
    breve: Data engineering
    descrizione: Pipeline, qualità e governance dei dati che alimentano modelli e agenti.
    arxiv: ["data curation", "data quality for machine learning", "synthetic data generation"]
    github: data-engineering
    jobs: {what_phrase: "training data"}
    risorse:
      - {titolo: "Data Engineering Zoomcamp (corso gratuito)", url: "https://github.com/DataTalksClub/data-engineering-zoomcamp", tipo: corso}
      - {titolo: "Documentazione di Hugging Face Datasets", url: "https://huggingface.co/docs/datasets/index", tipo: documentazione}
      - {titolo: "Tutorial ufficiali di Apache Airflow", url: "https://airflow.apache.org/docs/apache-airflow/stable/tutorial/index.html", tipo: guida}

  - id: text-to-sql
    nome: AI per analisi dati e BI
    breve: AI per BI
    descrizione: Interrogare database e modelli semantici in linguaggio naturale (text-to-SQL).
    arxiv: ["text-to-SQL", "table question answering"]
    github: text-to-sql
    jobs: {what_phrase: "text-to-SQL"}
    risorse:
      - {titolo: "Spider: benchmark di riferimento per text-to-SQL", url: "https://yale-lily.github.io/spider", tipo: documentazione}
      - {titolo: "BIRD: benchmark text-to-SQL su database reali", url: "https://bird-bench.github.io/", tipo: documentazione}
      - {titolo: "Guida LangChain: costruire un agente SQL", url: "https://docs.langchain.com/oss/python/langchain/sql-agent", tipo: guida}
      - {titolo: "Repository sql-eval per valutare il text-to-SQL", url: "https://github.com/defog-ai/sql-eval", tipo: repository}

  - id: vector-db
    nome: Database vettoriali
    breve: DB vettoriali
    plurale: true
    descrizione: Archivi di embedding per ricerca semantica e memoria degli agenti.
    arxiv: ["vector database", "approximate nearest neighbor search"]
    github: vector-database
    jobs: {what_phrase: "vector database"}
    risorse:
      - {titolo: "Wiki ufficiale di FAISS", url: "https://github.com/facebookresearch/faiss/wiki", tipo: documentazione}
      - {titolo: "Repository di pgvector per PostgreSQL", url: "https://github.com/pgvector/pgvector", tipo: repository}
      - {titolo: "Documentazione di Sentence Transformers (embedding)", url: "https://www.sbert.net/", tipo: documentazione}
      - {titolo: "Repository di Chroma, database vettoriale open source", url: "https://github.com/chroma-core/chroma", tipo: repository}

  - id: multimodale
    nome: Modelli multimodali
    breve: Multimodali
    plurale: true
    descrizione: Modelli che combinano testo, immagini, audio e video.
    arxiv: ["vision-language model", "multimodal large language model"]
    github: multimodal
    jobs: {what_phrase: "multimodal"}
    risorse:
      - {titolo: "Corso Hugging Face: introduzione ai modelli visione-linguaggio", url: "https://huggingface.co/learn/computer-vision-course/unit4/multimodal-models/vlm-intro", tipo: corso}
      - {titolo: "Hugging Face: i Vision Language Model spiegati", url: "https://huggingface.co/blog/vlms", tipo: guida}
      - {titolo: "Documentazione Anthropic sulla visione", url: "https://platform.claude.com/docs/en/build-with-claude/vision", tipo: documentazione}
      - {titolo: "Documentazione Gemini sulla comprensione delle immagini", url: "https://ai.google.dev/gemini-api/docs/image-understanding", tipo: documentazione}

  - id: llmops
    nome: LLMOps e messa in produzione
    breve: LLMOps
    descrizione: Rilascio, monitoraggio, costi e osservabilità dei sistemi basati su LLM.
    arxiv: ["LLMOps", "LLM serving", "inference optimization"]
    github: llmops
    jobs: {what_phrase: "MLOps"}
    risorse:
      - {titolo: "LLM Zoomcamp (corso gratuito)", url: "https://github.com/DataTalksClub/llm-zoomcamp", tipo: corso}
      - {titolo: "MLOps Zoomcamp (corso gratuito)", url: "https://github.com/DataTalksClub/mlops-zoomcamp", tipo: corso}
      - {titolo: "Documentazione di vLLM per il serving", url: "https://docs.vllm.ai/en/latest/", tipo: documentazione}
      - {titolo: "Documentazione MLflow per LLM e agenti", url: "https://mlflow.org/docs/latest/genai/", tipo: documentazione}

  - id: modelli-locali
    nome: Modelli piccoli e locali
    breve: Modelli locali
    plurale: true
    descrizione: Modelli aperti che girano su laptop o server propri, senza cloud.
    arxiv: ["small language model", "on-device inference", "quantization"]
    github: local-llm
    jobs: {what_phrase: "on-device AI"}
    risorse:
      - {titolo: "Repository di llama.cpp", url: "https://github.com/ggml-org/llama.cpp", tipo: repository}
      - {titolo: "Repository di Ollama", url: "https://github.com/ollama/ollama", tipo: repository}
      - {titolo: "Guida Hugging Face alla quantizzazione", url: "https://huggingface.co/docs/transformers/quantization/overview", tipo: documentazione}

  - id: robotica
    nome: AI fisica e robotica
    breve: Robotica
    descrizione: Modelli che percepiscono e agiscono nel mondo fisico (VLA, world model).
    arxiv: ["vision-language-action", "world model", "robot learning"]
    github: embodied-ai
    jobs: {what_phrase: "robot learning"}
    risorse:
      - {titolo: "Corso gratuito di Hugging Face sulla robotica", url: "https://huggingface.co/learn/robotics-course/unit0/1", tipo: corso}
      - {titolo: "Repository LeRobot di Hugging Face", url: "https://github.com/huggingface/lerobot", tipo: repository}
      - {titolo: "Repository di OpenVLA (modello visione-linguaggio-azione)", url: "https://github.com/openvla/openvla", tipo: repository}
