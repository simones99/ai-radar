    url: https://huggingface.co/blog/feed.xml
  - name: Epoch AI
    url: https://epochai.substack.com/feed
  - name: Import AI
    url: https://importai.substack.com/feed
  - name: EU AI Act Newsletter
    url: https://artificialintelligenceact.substack.com/feed
