# Fonti e parametri della pipeline.

# Paesi per la domanda di lavoro (Adzuna). Codici supportati da Adzuna.
# us = Stati Uniti, gb = Regno Unito; gli altri sono Paesi UE.
jobs_countries:
  us: Stati Uniti
  gb: Regno Unito
  de: Germania
  fr: Francia
  it: Italia
  es: Spagna
  nl: Paesi Bassi
  pl: Polonia
jobs_eu_countries: [de, fr, it, es, nl, pl]

# Paesi per l'adozione dell'AI nelle imprese (Eurostat, isoc_eb_ai).
eurostat_geo:
  EU27_2020: Unione europea (27)
  IT: Italia
  DE: Germania
  FR: Francia
  ES: Spagna
  NL: Paesi Bassi
  PL: Polonia
  DK: Danimarca
  FI: Finlandia
  SE: Svezia

# Settori per la sezione Adozione di Business (Eurostat, isoc_eb_ain2), solo Italia e UE.
# nace: codice NACE Rev. 2 di Eurostat. «Tutti» esclude la finanza, come il dato nazionale.
# nella_frase: il settore nella frase della porta («15% delle imprese manifatturiere italiane usa l'AI»).
eurostat_settori:
  settori:
    - {id: tutti, nome: Tutti, nace: C10-S951_X_K, nella_frase: delle imprese}
    - {id: manifattura, nome: Manifattura, nace: C, nella_frase: delle imprese manifatturiere}
    - {id: energia-acqua-rifiuti, nome: "Energia, acqua e rifiuti", nace: D_E, nella_frase: "delle imprese di energia, acqua e rifiuti"}
    - {id: costruzioni, nome: Costruzioni, nace: F, nella_frase: delle imprese di costruzioni}
    - {id: commercio, nome: Commercio, nace: G, nella_frase: delle imprese del commercio}
    - {id: trasporti, nome: Trasporti e logistica, nace: H, nella_frase: delle imprese di trasporti e logistica}
    - {id: alloggio-ristorazione, nome: Alloggio e ristorazione, nace: I, nella_frase: delle imprese di alloggio e ristorazione}
    - {id: ict, nome: Informazione e comunicazione, nace: J, nella_frase: delle imprese di informazione e comunicazione}
    - {id: immobiliare, nome: Immobiliare, nace: L, nella_frase: delle imprese immobiliari}
    - {id: professionali, nome: "Attività professionali, scientifiche e tecniche", nace: M, nella_frase: "delle imprese di servizi professionali, scientifici e tecnici"}
    - {id: servizi-imprese, nome: Noleggio e servizi alle imprese, nace: N, nella_frase: delle imprese di noleggio e servizi alle imprese}
  # A cosa serve l'AI: % delle imprese che usano l'AI (unit PC_ENT_AI_TANY).
  scopi:
    E_AI_PMS: Marketing e vendite
    E_AI_PPP: Processi di produzione
    E_AI_PBAM: Amministrazione e gestione
    E_AI_PLOG: Logistica
    E_AI_PITS: Sicurezza informatica
    E_AI_PFIN: Contabilità e finanza
    E_AI_PRDI: Ricerca, sviluppo e innovazione
  # Cosa frena chi non la usa: % delle imprese che hanno considerato l'AI senza usarla (unit PC_ENT_AI_EC).
  barriere:
    E_AI_BCST: Costi troppo alti
    E_AI_BLE: Mancano le competenze
    E_AI_BINC: Incompatibile con i sistemi esistenti
    E_AI_BDDT: Dati scarsi o di bassa qualità
    E_AI_BCDP: Timori per privacy e protezione dei dati
    E_AI_BLEG: Conseguenze legali poco chiare
    E_AI_BEC: Questioni etiche
    E_AI_BNU: L'AI non serve all'impresa

# Repository open source da seguire (stelle settimana per settimana).
github_repos:
  - huggingface/transformers
  - vllm-project/vllm
  - ollama/ollama
  - langchain-ai/langgraph
  - run-llama/llama_index
  - modelcontextprotocol/servers
  - openai/openai-agents-python
  - microsoft/autogen
  - crewAIInc/crewAI
  - anthropics/claude-code
  - ggml-org/llama.cpp
  - unslothai/unsloth

# Base dell'AI su GitHub per lo slancio del radar: nuovi repository al mese con questi topic, sommati.
# Uno solo sarebbe fragile: tra marzo e settembre 2026 «llm» è cresciuto del 56%, «ai» è calato dell'11%.
github_base_topics: [llm, ai, artificial-intelligence, generative-ai]

# Feed per le notizie. tema: politica, ricerca, prodotti, business.
# alternativi: indirizzi provati in ordine se il primo non risponde
# (alcuni Substack rispondono 403 da GitHub Actions).
feeds:
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    tema: prodotti
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    tema: ricerca
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    tema: ricerca
  - name: Epoch AI
    url: https://epoch.ai/atom.xml
    alternativi: [https://epochai.substack.com/feed]
    tema: ricerca
  - name: Import AI
    url: https://jack-clark.net/feed/
    alternativi: [https://importai.substack.com/feed]
    tema: ricerca
  - name: EU AI Act Newsletter
    url: https://artificialintelligenceact.substack.com/feed
    alternativi: [https://artificialintelligenceact.eu/feed/]
    tema: politica
  - name: Google AI
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
    tema: prodotti
  - name: Simon Willison
    url: https://simonwillison.net/atom/entries/   # solo articoli; /atom/everything/ include anche link e citazioni
    tema: prodotti
  - name: The Decoder
    url: https://the-decoder.com/feed/
    tema: prodotti
  - name: Latent Space
    url: https://www.latent.space/feed
    tema: business

# Quanti giorni di notizie tenere e quante al massimo per fonte.
feeds_days: 45
feeds_per_source: 12

# Our World in Data: grafici del grapher (https://ourworldindata.org/grapher/<slug>).
# colonna = nome breve della colonna nel CSV; entita = righe da tenere (assente = tutte).
# Licenze verificate il 2026-10-15 (metadati OWID: nessun produttore vieta di ripubblicare i numeri).
# Da tenere d'occhio: AI Index/Stanford HAI (Quid, McKinsey, Lightcast) e' CC BY-ND 4.0, quindi
# i dati vanno citati senza alterarli; IEA (testo (c) OECD/IEA), NVIDIA e TSMC sono (c) dei produttori:
# si mostrano solo cifre di fatto con la fonte, e le condizioni vanno riviste se il loro uso cambia.
# licenza = licenza dei dati mostrata in pagina accanto alla citazione (CC BY 4.0 per le altre serie OWID).
owid:
  - id: investimenti_privati
    slug: private-investment-in-artificial-intelligence
    colonna: private_investment
    licenza: "CC BY-ND 4.0"
    entita: [World, United States, China, Europe]
  - id: investimenti_generativa
    slug: global-investment-in-generative-ai
    colonna: generative_ai
    licenza: "CC BY-ND 4.0"
    entita: [World]
  - id: investimenti_tipo
    slug: corporate-investment-in-artificial-intelligence-by-type
    colonna: corporate_investment
    licenza: "CC BY-ND 4.0"
  - id: imprese_ai
    slug: share-companies-using-artificial-intelligence
    colonna: pct_of_respondents
    licenza: "CC BY-ND 4.0"
  - id: uso_genai
    slug: estimated-share-people-generative-ai
    colonna: ai_user_share
    licenza: "CC BY 4.0"
    entita: [World, Italy, United States, China, Germany, France, Spain, United Kingdom]
  - id: uso_genai_ue
    slug: share-europe-using-generative-ai
    colonna: pct_used_genai_16_74
    licenza: "CC BY 4.0"
  - id: uso_genai_giovani_ue
    slug: share-of-young-people-in-european-countries-using-generative-ai-tools
    colonna: pct_used_genai_16_24
    licenza: "CC BY 4.0"
  - id: sviluppatori_ai
    slug: share-of-professional-software-developers-using-ai-tools
    colonna: yes_overall
    licenza: "CC BY 4.0"
    entita: [World]
  - id: annunci_ai
    slug: share-artificial-intelligence-job-postings
    colonna: ai_job_postings_share
    licenza: "CC BY-ND 4.0"
  - id: data_center_spesa
    slug: monthly-spending-data-center-us
    colonna: datacenter_construction_spending_real
    licenza: "CC BY 4.0"
    entita: [United States]
  - id: data_center_elettricita
    slug: data-centers-share-electricity-demand
    colonna: total_electricity_consumption__share_of_total_electricity_demand__historical
    licenza: "© OECD/IEA"
    entita: [World, United States, China, Europe (IEA)]
  - id: nvidia_ricavi
    slug: nvidia-quarterly-revenue-segment
    colonna: revenue
    licenza: "© NVIDIA"
    entita: [Data centers and AI, Gaming, Total]
  - id: tsmc_ricavi
    slug: tsmc-annual-revenue
    colonna: revenue_usd
    licenza: "© TSMC"
    entita: [Taiwan]
