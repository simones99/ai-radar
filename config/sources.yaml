# Fonti e parametri della pipeline.

# Paesi per la domanda di lavoro (Adzuna). Codici supportati da Adzuna.
# us = Stati Uniti, gb = Regno Unito; gli altri sono Paesi UE.
jobs_countries:
  us: Stati Uniti
  gb: Regno Unito
  de: Germania
  fr: Francia
  it: Italia
  es: Spagna
  nl: Paesi Bassi
  pl: Polonia
jobs_eu_countries: [de, fr, it, es, nl, pl]

# Paesi per l'adozione dell'AI nelle imprese (Eurostat, isoc_eb_ai).
eurostat_geo:
  EU27_2020: Unione europea (27)
  IT: Italia
  DE: Germania
  FR: Francia
  ES: Spagna
  NL: Paesi Bassi
  PL: Polonia
  DK: Danimarca
  FI: Finlandia
  SE: Svezia

# Repository open source da seguire (stelle settimana per settimana).
github_repos:
  - huggingface/transformers
  - vllm-project/vllm
  - ollama/ollama
  - langchain-ai/langgraph
  - run-llama/llama_index
  - modelcontextprotocol/servers
  - openai/openai-agents-python
  - microsoft/autogen
  - crewAIInc/crewAI
  - anthropics/claude-code
  - ggml-org/llama.cpp
  - unslothai/unsloth

